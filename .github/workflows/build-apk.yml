name: Сборка APK
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends automake autoconf libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev cmake zip unzip wget git ccache
      - run: python -m pip install --upgrade pip && python -m pip install --upgrade buildozer
      - run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with: { name: fuelbot-apk, path: bin/*.apk }
